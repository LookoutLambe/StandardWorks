<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblical Hebrew Study</title>
  <meta name="theme-color" content="#1e2233" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f2;
      --ink: #1a1a1a;
      --muted: #555;
      --accent: #c8a84e;
      --header: #1e2233;
      --rule: #d6ceb8;
    }
    body {
      margin: 0;
      font-family: 'David Libre', Georgia, serif;
      background: var(--bg);
      color: var(--ink);
    }
    .top {
      background: var(--header);
      border-bottom: 2px solid var(--accent);
      padding: 14px 20px;
      text-align: center;
    }
    .top h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.03em;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 36px 20px 64px;
    }
    .lede {
      font-size: 1.08rem;
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 28px;
    }
    ul.nav-cards {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    ul.nav-cards a {
      display: block;
      padding: 16px 18px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: #fffefb;
      text-decoration: none;
      color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
    }
    ul.nav-cards a:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 14px rgba(30,34,51,0.08);
    }
    ul.nav-cards a strong {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      margin-bottom: 4px;
    }
    ul.nav-cards a span {
      font-size: 0.95rem;
      color: var(--muted);
    }
    .footer-note {
      margin-top: 40px;
      padding-top: 22px;
      border-top: 1px solid var(--rule);
      font-size: 0.9rem;
      color: var(--muted);
    }
    .footer-note a {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>Biblical Hebrew study · לימוד עברית מקראית</h1>
  </header>
  <main>
    <p class="lede">
      Hebrew study tools that remain in this bundle: Strong’s dictionary. For scripture volumes, use the library hub.
    </p>
    <ul class="nav-cards">
      <li><a href="dictionary.html"><strong>Dictionary</strong><span>Strong’s Hebrew lookup tools</span></a></li>
    </ul>
    <p class="footer-note">
      Looking for Torah / New Testament / Book of Mormon? That is separate: <a href="index.html">Standard Works volumes</a>.
    </p>
  </main>
</body>
</html>
